name: MC1 Hosted Synthetic Composition

on:
  pull_request:
    paths:
      - ".github/workflows/mc1-hosted-synthetic.yml"
      - "scripts/mc1/**"
      - "test/mc1-lab.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Pinned Mission Control to exact Gateway (synthetic Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Dashboard
        uses: actions/checkout@v4

      - name: Checkout exact accepted Gateway source
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-Gateway
          ref: 9c42bdc21073020c3d7194446b0f2ae929eb25a2
          path: gateway-source
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build existing Dashboard scripts
        run: |
          npm ci
          npm run build

      - name: Enable audited Mission Control package manager
        run: corepack enable

      - name: Run disposable real-HTTP integration through existing MC1 proof
        env:
          CI: "true"
        run: node scripts/mc1/ci-synthetic-proof.mjs
